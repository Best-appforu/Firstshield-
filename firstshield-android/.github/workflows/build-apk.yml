name: Build FirstShield APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # Manual trigger button in GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FirstShield-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release (on push to main/master)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FirstShield v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## FirstShield Android App
            
            ### Features in this build
            - 🛡 App Security Scanner — flags risky permissions on newly opened apps
            - 👁 Eye Care (20-20-20 rule) — overlay reminder after configurable interval
            - ⏱ Screen Time Tracker — daily usage limit with fullscreen alert
            - 🎧 Bluetooth Alert — popup ONLY when Bluetooth audio device connects (never on launch)
            - 🔋 Battery Optimization — exempt from doze so services survive in background
            - 🧙 First-Launch Setup Wizard — step-by-step permission guide
            
            ### Install
            1. Download `app-debug.apk` below
            2. On your Android phone: Settings → Security → Install unknown apps → Allow
            3. Open the downloaded APK and tap Install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
